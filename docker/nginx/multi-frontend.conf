pid logs/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr info;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 100m;

  upstream langflow_backend {
    server 127.0.0.1:7861;
  }

  server {
    listen 7860;
    server_name _;

    root /app/static;

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files /frontend-shell$uri /frontend-app$uri =404;
    }

    location = / {
      try_files /frontend-shell/index.html @backend;
    }

    location = /login {
      try_files /frontend-shell/index.html @backend;
    }

    location = /signup {
      try_files /frontend-shell/index.html @backend;
    }

    location ^~ /organization {
      try_files /frontend-shell/index.html @backend;
    }

    location /api/ {
      proxy_pass http://langflow_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }

    location /ws/ {
      proxy_pass http://langflow_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
    }

    location /docs {
      proxy_pass http://langflow_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
      proxy_pass http://langflow_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
      proxy_pass http://langflow_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri /frontend-app$uri /frontend-app/index.html @backend;
    }

    location @backend {
      proxy_pass http://langflow_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }
  }
}
