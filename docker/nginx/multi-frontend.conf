user  user;
pid   /tmp/nginx.pid;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 4096;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /dev/stdout  main;
  error_log   /dev/stderr  warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream backend {
    server 127.0.0.1:7861;
  }

  server {
    listen 7860;
    listen [::]:7860;

    # Static assets for the landing/login shell
    location ^~ /shell-assets/ {
      alias /app/static/frontend-shell/shell-assets/;
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Static assets for the application bundle
    location ^~ /app-assets/ {
      alias /app/static/frontend-app/app-assets/;
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location = / {
      root /app/static/frontend-shell;
      try_files $uri /index.html;
    }

    location = /login {
      root /app/static/frontend-shell;
      try_files $uri /index.html;
    }

    location = /organization {
      root /app/static/frontend-shell;
      try_files $uri /index.html;
    }

    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location /health {
      proxy_pass http://backend/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      root /app/static/frontend-app;
      try_files $uri /index.html;
    }
  }
}
