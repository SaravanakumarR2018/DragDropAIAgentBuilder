worker_processes auto;

error_log  /tmp/nginx-error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /tmp/nginx-access.log  main;

    server {
        listen       8080;
        server_name  _;

        client_max_body_size 100M;

        location /api/ {
            proxy_pass http://127.0.0.1:7860/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:7860/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        location = /health {
            proxy_pass http://127.0.0.1:7860/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = / {
            root   /app/static/frontend-shell;
            try_files $uri /index.html;
        }

        location /login {
            root   /app/static/frontend-shell;
            try_files $uri $uri/ /index.html;
        }

        location /organization {
            root   /app/static/frontend-shell;
            try_files $uri $uri/ /index.html;
        }

        location /shell-assets/ {
            alias /app/static/frontend-shell/shell-assets/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            root   /app/static/frontend-app;
            try_files $uri $uri/ /index.html;
        }
    }
}
