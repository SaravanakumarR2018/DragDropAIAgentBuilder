[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:langflow]
command=/app/.venv/bin/langflow run --host ${LANGFLOW_HOST} --port ${LANGFLOW_BACKEND_PORT}
directory=/app
autostart=true
autorestart=true
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=user
environment=LANGFLOW_HOST="%(ENV_LANGFLOW_HOST)s",LANGFLOW_PORT="%(ENV_LANGFLOW_BACKEND_PORT)s"

[program:nginx]
command=/bin/sh -c "envsubst '\$NGINX_PORT \$LANGFLOW_BACKEND_PORT' </etc/nginx/nginx.conf.template >/tmp/nginx.conf && exec /usr/sbin/nginx -g 'daemon off;' -c /tmp/nginx.conf"
autostart=true
autorestart=true
stopsignal=QUIT
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
