server {
    listen 7860;
    server_name _;

    # Landing page (exact match only)
    location = / {
        root /usr/share/nginx/html/frontend1;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Auth-related routes (and their nested paths)
    location ^~ /login {
        root /usr/share/nginx/html/frontend1;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /signup {
        root /usr/share/nginx/html/frontend1;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /organization {
        root /usr/share/nginx/html/frontend1;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Static assets with fallback from frontend1 → frontend2
    location /assets/ {
        root /usr/share/nginx/html;
        try_files /frontend1$uri /frontend2$uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:7861;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header Cache-Control "no-cache, no-store";
    }

    # Default fallback to frontend2 (main app routes)
    location / {
        root /usr/share/nginx/html/frontend2;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
