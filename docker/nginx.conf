server {
    listen 7860;
    server_name _;

    # Routes served by frontend1
    location = / {
        root /usr/share/nginx/html/frontend1;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /login {
        root /usr/share/nginx/html/frontend1;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /organization {
        root /usr/share/nginx/html/frontend1;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Static assets (serve from frontend1, fallback to frontend2)
    location /assets/ {
        root /usr/share/nginx/html;
        try_files /frontend1$uri /frontend2$uri =404;
        types {
            application/javascript js;
            text/css css;
            font/woff2 woff2;
            font/woff woff;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg;
            application/json json;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend API proxy (local backend)
    location /api/ {
        proxy_pass http://127.0.0.1:7861;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header Cache-Control "no-cache, no-store";
    }

    # Everything else: serve from frontend2
    location / {
        root /usr/share/nginx/html/frontend2;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
