server {
    listen 7860;
    server_name _;

    # Frontend 1: landing, login, organization
    location ~ ^/(|login|organisation)(/.*)?$ {
        root /usr/share/nginx/html/frontend1;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Frontend 2: main app (flows, settings, etc.)
    location ~ ^/(flows|settings|home|dashboard)(/.*)?$ {
        root /usr/share/nginx/html/frontend2;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Static assets for both frontends
    location /assets/ {
        try_files $uri $uri/ =404;
        root /usr/share/nginx/html/frontend1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:7861;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header Cache-Control "no-cache, no-store";
    }

    # Default fallback
    location / {
        root /usr/share/nginx/html/frontend1;
        try_files $uri $uri/ /index.html;
    }
}