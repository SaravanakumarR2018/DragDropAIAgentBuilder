name: Alembic Migration - Staging/Prod Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Select a Branch to deploy"
        required: true
        default: "main"
      environment:
        description: "Select environment to deploy (staging or prod)"
        required: true
        default: "staging"
      email:
        description: "Admin email for deployment"
        required: true
        default: "saravana.k.r@gmail.com"
      commit_id:
        description: "Commit ID to deploy (leave blank for latest on branch)"
        required: false
        default: ""

env:
  GA_POSTGRES_PGUSER: galangflow
  GA_POSTGRES_PGPASSWORD: galangflow
  GA_POSTGRES_DB_NAME: galangflow
  GA_POSTGRES_HOST: localhost
  GA_POSTGRES_PORT: 5432

jobs:
  check-db-changes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ${{ vars.POSTGRESQL_DOCKER_VERSION }}
        env:
          POSTGRES_USER: ${{ env.GA_POSTGRES_PGUSER }}
          POSTGRES_PASSWORD: ${{ env.GA_POSTGRES_PGPASSWORD }}
          POSTGRES_DB: ${{ env.GA_POSTGRES_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      db_changes: ${{ steps.compare.outputs.db_changes }}
      repo_revision: ${{ steps.repo_version.outputs.repo_alembic_version }}
      vm_revision: ${{ steps.vm_output.outputs.vm_alembic_version }}
      commit_id: ${{ steps.commit.outputs.commit_id }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Checkout specific commit if provided
        if: ${{ github.event.inputs.commit_id != '' }}
        run: |
          git fetch --depth=1 origin ${{ github.event.inputs.commit_id }}
          git checkout ${{ github.event.inputs.commit_id }}

      - name: Determine Commit ID
        id: commit
        run: |
          if [ -n "${{ github.event.inputs.commit_id }}" ]; then
            echo "commit_id=${{ github.event.inputs.commit_id }}" >> $GITHUB_OUTPUT
          else
            echo "commit_id=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Build GA PostgreSQL DATABASE_URLs
        run: |
          echo "GA_POSTGRES_DATABASE_URL_ASYNC=postgresql+psycopg_async://${GA_POSTGRES_PGUSER}:${GA_POSTGRES_PGPASSWORD}@${GA_POSTGRES_HOST}:${GA_POSTGRES_PORT}/${GA_POSTGRES_DB_NAME}" >> $GITHUB_ENV
          echo "GA_POSTGRES_DATABASE_URL_SYNC=postgresql://${GA_POSTGRES_PGUSER}:${GA_POSTGRES_PGPASSWORD}@${GA_POSTGRES_HOST}:${GA_POSTGRES_PORT}/${GA_POSTGRES_DB_NAME}" >> $GITHUB_ENV    

      - name: Resolve website domain dynamically
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          ENV_FILE=".env-file"

          if [ ! -f "$ENV_FILE" ]; then
            echo "❌ $ENV_FILE not found"
            exit 1
          fi

          BASE_DOMAIN=$(grep '^LANGFLOW_WEBSITE_DOMAIN=' "$ENV_FILE" | tail -n1 | cut -d'=' -f2-)

          if [ -z "$BASE_DOMAIN" ]; then
            echo "❌ LANGFLOW_WEBSITE_DOMAIN missing in $ENV_FILE"
            exit 1
          fi

          STAGING_HOST="staging.${BASE_DOMAIN}"
          PROD_HOST="${BASE_DOMAIN}"

          if [ "$ENVIRONMENT" = "staging" ]; then
            WEBSITE_DOMAIN="$STAGING_HOST"
          else
            WEBSITE_DOMAIN="$PROD_HOST"
          fi

          echo "WEBSITE_DOMAIN=$WEBSITE_DOMAIN" >> $GITHUB_ENV
          echo "STAGING_HOST=$STAGING_HOST" >> $GITHUB_ENV
          echo "PROD_HOST=$PROD_HOST" >> $GITHUB_ENV

      - name: Resolve DB credentials
        run: |
          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            echo "VM_POSTGRES_PGUSER=${{ secrets.POSTGRES_USER }}" >> $GITHUB_ENV
            echo "VM_POSTGRES_PGPASSWORD=${{ secrets.POSTGRES_PASSWD }}" >> $GITHUB_ENV
            echo "VM_POSTGRES_DB_NAME=${{ secrets.POSTGRES_DB }}" >> $GITHUB_ENV
          else
            echo "VM_POSTGRES_PGUSER=${{ secrets.PROD_POSTGRES_USER }}" >> $GITHUB_ENV
            echo "VM_POSTGRES_PGPASSWORD=${{ secrets.PROD_POSTGRES_PASSWD }}" >> $GITHUB_ENV
            echo "VM_POSTGRES_DB_NAME=${{ secrets.PROD_POSTGRES_DB }}" >> $GITHUB_ENV
          fi

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          cd src/backend/base
          pip install uv
          pip install "psycopg[binary]"
          pip install asyncpg
          pip install google-generativeai
          pip install .

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            if pg_isready \
              -h localhost \
              -p 5432 \
              -U ${GA_POSTGRES_PGUSER}; then
                exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Apply migrations to GitHub PostgreSQL
        working-directory: src/backend/base/langflow
        env:
          LANGFLOW_DATABASE_URL: ${{ env.GA_POSTGRES_DATABASE_URL_ASYNC }}   
        run : |
          cp alembic.ini /tmp/alembic.runtime.ini
          sed -i "s#^sqlalchemy.url = .*#sqlalchemy.url = ${LANGFLOW_DATABASE_URL}#" /tmp/alembic.runtime.ini
          alembic -c /tmp/alembic.runtime.ini upgrade head

      - name: Get repo alembic version
        id: repo_version
        run: |
          python .github/script/check_db_changes.py \
            --database-url "${GA_POSTGRES_DATABASE_URL_SYNC}" \
            --output-key repo_alembic_version
    

      - name: Copy check_db_changes.py to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ github.event.inputs.environment == 'staging' && env.STAGING_HOST || env.PROD_HOST }}
          username: root
          password: ${{ github.event.inputs.environment == 'staging' && secrets.VM_PASSWORD || secrets.PROD_VM_PASSWORD }}
          source: ".github/script/check_db_changes.py"
          target: "/root/workspace/"

      - name: Get VM alembic version
        id: vm_version
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ github.event.inputs.environment == 'staging' && env.STAGING_HOST || env.PROD_HOST }}
          username: root
          password: ${{ github.event.inputs.environment == 'staging' && secrets.VM_PASSWORD || secrets.PROD_VM_PASSWORD }}
          capture_stdout: "true"
          envs: VM_POSTGRES_PGUSER,VM_POSTGRES_PGPASSWORD,VM_POSTGRES_DB_NAME
          script: |
            export GITHUB_OUTPUT=/tmp/gout
            python3 /root/workspace/.github/script/check_db_changes.py \
              --vm-docker \
              --db-user $VM_POSTGRES_PGUSER \
              --db-name $VM_POSTGRES_DB_NAME \
              --docker-container postgres \
              --output-key vm_alembic_version
            cat /tmp/gout  

      - name: Compare Alembic versions
        id: compare
        run: |
          REPO_REVISION="${{ steps.repo_version.outputs.repo_alembic_version }}"
          VM_REVISION=$(echo "${{ steps.vm_version.outputs.stdout }}" | grep -oE '[0-9a-f]{12,40}' | head -n 1)

          echo "Repo Revision: $REPO_REVISION"
          echo "VM Revision:   $VM_REVISION"

          if [ "$REPO_REVISION" != "$VM_REVISION" ]; then
            echo "db_changes=true" >> $GITHUB_OUTPUT
          else
            echo "db_changes=false" >> $GITHUB_OUTPUT
          fi      

      - name: Export VM revision output
        id: vm_output
        run: |
          VM_REVISION=$(echo "${{ steps.vm_version.outputs.stdout }}" | grep -oE '[0-9a-f]{12,40}' | head -n 1)
          echo "vm_alembic_version=$VM_REVISION" >> $GITHUB_OUTPUT         

  migration-flow:
    runs-on: ubuntu-latest
    needs: check-db-changes
    if: needs.check-db-changes.outputs.db_changes == 'true'

    env:
      VM_REVISION: ${{ needs.check-db-changes.outputs.vm_revision }}
      REPO_REVISION: ${{ needs.check-db-changes.outputs.repo_revision }}

    steps:
      - name: Print Alembic versions (VM vs Repo)
        run: |
          echo "========== ALEMBIC VERSION CHECK =========="
          echo "VM_REVISION   : ${VM_REVISION}"
          echo "REPO_REVISION : ${REPO_REVISION}"
          echo "=========================================="
          
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-db-changes.outputs.commit_id }}

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd src/backend/base
          pip install uv
          pip install psycopg2-binary asyncpg
          pip install google-genai
          pip install .

      - name: Generate SQL Migration Files
        working-directory: src/backend/base/langflow
        run: |
          mkdir -p alembic_sql

          alembic -c alembic.ini downgrade ${REPO_REVISION}:${VM_REVISION} --sql \
            > alembic_sql/downgrade.sql

          alembic -c alembic.ini upgrade ${VM_REVISION}:${REPO_REVISION} --sql \
            > alembic_sql/upgrade.sql

      - name: Validate SQL with Gemini
        id: validate_sql
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail

          OUTPUT=$(python .github/script/verify_sql_with_gemini.py src/backend/base/langflow/alembic_sql/upgrade.sql || true)
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -qi "UPGRADE_FORWARD: YES"; then
            echo "gemini_pass=YES" >> "$GITHUB_OUTPUT"
          else
            echo "gemini_pass=NO" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Manual approval for DB changes
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          
      - name: Upload SQL files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alembic-sql-${{ github.run_id }}
          path: src/backend/base/langflow/alembic_sql/

  apply-migrations-in-GA-Postgres:
    runs-on: ubuntu-latest
    needs:
      - migration-flow
    if: needs.migration-flow.result == 'success'

    outputs:
      upgrade_status: ${{ steps.upgrade_result.outputs.upgrade_status }}
      upgrade_error: ${{ steps.upgrade_result.outputs.upgrade_error }}  

    services:
      postgres:
        image: ${{ vars.POSTGRESQL_DOCKER_VERSION }}
        env:
          POSTGRES_USER: ${{ env.GA_POSTGRES_PGUSER }}
          POSTGRES_PASSWORD: ${{ env.GA_POSTGRES_PGPASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-db-changes.outputs.commit_id }}

      - name: Download SQL artifact
        uses: actions/download-artifact@v4
        with:
          name: alembic-sql-${{ github.run_id }}
          path: alembic_sql  

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            if pg_isready -h ${{ env.GA_POSTGRES_HOST }} -p ${{ env.GA_POSTGRES_PORT }} -U ${{ env.GA_POSTGRES_PGUSER }}; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Resolve website domain dynamically
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          ENV_FILE=".env-file"

          if [ ! -f "$ENV_FILE" ]; then
            echo "❌ $ENV_FILE not found"
            exit 1
          fi

          BASE_DOMAIN=$(grep '^LANGFLOW_WEBSITE_DOMAIN=' "$ENV_FILE" | tail -n1 | cut -d'=' -f2-)

          if [ -z "$BASE_DOMAIN" ]; then
            echo "❌ LANGFLOW_WEBSITE_DOMAIN missing in $ENV_FILE"
            exit 1
          fi

          STAGING_HOST="staging.${BASE_DOMAIN}"
          PROD_HOST="${BASE_DOMAIN}"

          if [ "$ENVIRONMENT" = "staging" ]; then
            WEBSITE_DOMAIN="$STAGING_HOST"
          else
            WEBSITE_DOMAIN="$PROD_HOST"
          fi

          echo "WEBSITE_DOMAIN=$WEBSITE_DOMAIN" >> $GITHUB_ENV
          echo "STAGING_HOST=$STAGING_HOST" >> $GITHUB_ENV
          echo "PROD_HOST=$PROD_HOST" >> $GITHUB_ENV    

      - name: Dump FULL PostgreSQL cluster on target VM
        uses: appleboy/ssh-action@v1.2.2
        env:
          TARGET_HOST: ${{ github.event.inputs.environment == 'staging' && env.STAGING_HOST || env.PROD_HOST }}
          TARGET_PASSWORD: ${{ github.event.inputs.environment == 'staging' && secrets.VM_PASSWORD || secrets.PROD_VM_PASSWORD }}
          TARGET_PG_USER: ${{ github.event.inputs.environment == 'staging' && secrets.POSTGRES_USER || secrets.PROD_POSTGRES_USER }}
        with:
          host: ${{ env.TARGET_HOST }}
          username: root
          password: ${{ env.TARGET_PASSWORD }}
          script: |
            cd /home
            docker exec postgres pg_dumpall \
              -U ${{ env.TARGET_PG_USER }} \
              --no-owner --no-acl \
              > full_cluster.sql

            ls -lh full_cluster.sql

      - name: Copy cluster dump from VM
        env:
          VM_PASSWORD: ${{ github.event.inputs.environment == 'staging' && secrets.VM_PASSWORD || secrets.PROD_VM_PASSWORD }}
          VM_HOST: ${{ github.event.inputs.environment == 'staging' && env.STAGING_HOST || env.PROD_HOST }}
        run: |
          sshpass -p "$VM_PASSWORD" scp -o StrictHostKeyChecking=no \
            root@${VM_HOST}:/home/full_cluster.sql \
            $GITHUB_WORKSPACE/full_cluster.sql      

      - name: Restore FULL cluster into GA PostgreSQL
        run: |
          psql -h ${{ env.GA_POSTGRES_HOST }} -p ${{ env.GA_POSTGRES_PORT }} -U ${{ env.GA_POSTGRES_PGUSER }} -d postgres -f full_cluster.sql
        env:
          PGPASSWORD: ${{ env.GA_POSTGRES_PGPASSWORD }}       

      - name: Apply upgrade.sql to app DB and org DBs
        if: ${{ hashFiles('alembic_sql/upgrade.sql') != '' }}
        env:
          PGPASSWORD: ${{ env.GA_POSTGRES_PGPASSWORD }}
          APP_DB_NAME: ${{ github.event.inputs.environment == 'staging' && secrets.POSTGRES_DB || secrets.PROD_POSTGRES_DB }}
        run: |
          set -e
          rm -f /tmp/upgrade_error.txt /tmp/upgrade_success.txt

          UPGRADE_SQL_PATH="alembic_sql/upgrade.sql"
          ls -l "$UPGRADE_SQL_PATH"
          DBS=$(psql -h ${{ env.GA_POSTGRES_HOST }} -p ${{ env.GA_POSTGRES_PORT }} -U ${{ env.GA_POSTGRES_PGUSER }} -At \
            -c "SELECT datname FROM pg_database WHERE datname='${APP_DB_NAME}' OR datname LIKE 'org_%';")

          for db in $DBS; do
            echo "Applying upgrade.sql to $db"
            trap 'echo "Upgrade failed on database: '"$db"'" > /tmp/upgrade_error.txt' ERR
            psql -h ${{ env.GA_POSTGRES_HOST }} -p ${{ env.GA_POSTGRES_PORT }} -U ${{ env.GA_POSTGRES_PGUSER }} -d "$db" --file="$UPGRADE_SQL_PATH"
          done
          echo "SUCCESS" > /tmp/upgrade_success.txt

      - name: Set upgrade result
        id: upgrade_result
        if: always()
        run: |
          if [ -f /tmp/upgrade_error.txt ]; then
            echo "upgrade_status=failure" >> $GITHUB_OUTPUT
            echo "upgrade_error=$(cat /tmp/upgrade_error.txt)" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [ ! -f /tmp/upgrade_success.txt ]; then
            echo "upgrade_status=failure" >> $GITHUB_OUTPUT
            echo "upgrade_error=Upgrade status unknown (success marker missing)" >> $GITHUB_OUTPUT
            exit 1
          fi  

          echo "upgrade_status=success" >> $GITHUB_OUTPUT   

  manual-approval:
    runs-on: ubuntu-latest
    needs: apply-migrations-in-GA-Postgres
    if: needs.apply-migrations-in-GA-Postgres.outputs.upgrade_status == 'success'

    steps:
      - name: Await manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1

  apply-migrations-in-VM-Postgres:
    runs-on: ubuntu-latest
    needs: manual-approval
    if: needs.manual-approval.result == 'success'

    steps:
      - name: Checkout resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-db-changes.outputs.commit_id }}
      
      - name: Download SQL artifact
        uses: actions/download-artifact@v4
        with:
          name: alembic-sql-${{ github.run_id }}
          path: alembic_sql 

      - name: Resolve website domain dynamically
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          ENV_FILE=".env-file"

          if [ ! -f "$ENV_FILE" ]; then
            echo "❌ $ENV_FILE not found"
            exit 1
          fi

          BASE_DOMAIN=$(grep '^LANGFLOW_WEBSITE_DOMAIN=' "$ENV_FILE" | tail -n1 | cut -d'=' -f2-)

          if [ -z "$BASE_DOMAIN" ]; then
            echo "❌ LANGFLOW_WEBSITE_DOMAIN missing in $ENV_FILE"
            exit 1
          fi

          STAGING_HOST="staging.${BASE_DOMAIN}"
          PROD_HOST="${BASE_DOMAIN}"

          if [ "$ENVIRONMENT" = "staging" ]; then
            WEBSITE_DOMAIN="$STAGING_HOST"
          else
            WEBSITE_DOMAIN="$PROD_HOST"
          fi

          echo "WEBSITE_DOMAIN=$WEBSITE_DOMAIN" >> $GITHUB_ENV
          echo "STAGING_HOST=$STAGING_HOST" >> $GITHUB_ENV
          echo "PROD_HOST=$PROD_HOST" >> $GITHUB_ENV        

      - name: Copy upgrade.sql to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ github.event.inputs.environment == 'staging' && env.STAGING_HOST || env.PROD_HOST }}
          username: root
          password: ${{ github.event.inputs.environment == 'staging' && secrets.VM_PASSWORD || secrets.PROD_VM_PASSWORD }}
          source: "alembic_sql/upgrade.sql"
          target: "/root/db-migrations/"

      - name: Apply upgrade.sql on VM databases
        uses: appleboy/ssh-action@v1.2.2
        env:
          TARGET_HOST: ${{ github.event.inputs.environment == 'staging' && env.STAGING_HOST || env.PROD_HOST }}
          TARGET_VM_PASSWORD: ${{ github.event.inputs.environment == 'staging' && secrets.VM_PASSWORD || secrets.PROD_VM_PASSWORD }}
          TARGET_PG_USER: ${{ github.event.inputs.environment == 'staging' && secrets.POSTGRES_USER || secrets.PROD_POSTGRES_USER }}
          TARGET_APP_DB: ${{ github.event.inputs.environment == 'staging' && secrets.POSTGRES_DB || secrets.PROD_POSTGRES_DB }}
          ENV_LABEL: ${{ github.event.inputs.environment }}
        with:
          host: ${{ env.TARGET_HOST }}
          username: root
          password: ${{ env.TARGET_VM_PASSWORD }}
          envs: TARGET_PG_USER,TARGET_APP_DB,ENV_LABEL
          script: |
            set -e
            rm -f /tmp/migration_error.txt /tmp/migration_success.txt

            SQL_FILE="/root/db-migrations/alembic_sql/upgrade.sql"

            if [ ! -f "$SQL_FILE" ]; then
              echo "upgrade.sql missing on VM" > /tmp/migration_error.txt
             exit 1
            fi

            DBS=$(docker exec postgres psql -U "$TARGET_PG_USER" -At \
              -c "SELECT datname FROM pg_database WHERE datname='${TARGET_APP_DB}' OR datname LIKE 'org_%';")

            for db in $DBS; do
              echo "Migrating database: $db"
              trap 'echo "Migration failed on database: '"$db"'" > /tmp/migration_error.txt' ERR
              docker exec -i postgres psql -U "$TARGET_PG_USER" -d "$db" \
                < "$SQL_FILE"
            done
            echo "SUCCESS" > /tmp/migration_success.txt

            echo "Migration completed on ${ENV_LABEL} VM"

      - name: Collect migration result
        if: always()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ github.event.inputs.environment == 'staging' && env.STAGING_HOST || env.PROD_HOST }}
          username: root
          password: ${{ github.event.inputs.environment == 'staging' && secrets.VM_PASSWORD || secrets.PROD_VM_PASSWORD }}
          script: |
            if [ -f /tmp/migration_error.txt ]; then
              echo "❌ MIGRATION FAILED"
              cat /tmp/migration_error.txt
              exit 1
            fi

            if [ ! -f /tmp/migration_success.txt ]; then
              echo "❌ MIGRATION STATUS UNKNOWN (success marker missing)"
              exit 1
            fi

            echo "✅ MIGRATION SUCCESS CONFIRMED"    

      - name: Migration summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Migration Status: SUCCESS"
          else
            echo "❌ Migration Status: FAILURE"
            echo "Reason: SQL execution failed, DB-level error, or upgrade.sql missing"
          fi