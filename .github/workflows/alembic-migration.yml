name: Alembic Migration - Staging/Prod Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Select a Branch to deploy"
        required: true
        default: "main"
      environment:
        description: "Select environment to deploy (staging or prod)"
        required: true
        default: "staging"
      email:
        description: "Admin email for deployment"
        required: true
        default: "saravana.k.r@gmail.com"
      commit_id:
        description: "Commit ID to deploy (leave blank for latest on branch)"
        required: false
        default: ""

env:
  STAGING_HOST: staging.visualaiagentsbuilder.com
  PROD_HOST: visualaiagentsbuilder.com

jobs:
  check-db-changes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ${{ vars.POSTGRESQL_DOCKER_VERSION }}
        env:
          POSTGRES_USER: langflow
          POSTGRES_PASSWORD: langflow
          POSTGRES_DB: langflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U langflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      db_changes: ${{ steps.compare.outputs.db_changes }}
      repo_revision: ${{ steps.repo_version.outputs.repo_alembic_version }}
      vm_revision: ${{ steps.vm_output.outputs.vm_alembic_version }}
      commit_id: ${{ steps.commit.outputs.commit_id }}

    env:
      LOCAL_GITHUB_POSTGRES_USER: langflow
      LOCAL_GITHUB_POSTGRES_PASSWORD: langflow
      LOCAL_GITHUB_POSTGRES_HOST: localhost
      LOCAL_GITHUB_POSTGRES_PORT: 5432
      LOCAL_GITHUB_POSTGRES_DB_NAME: langflow
      LOCAL_GITHUB_POSTGRES_DATABASE_URL: postgresql://langflow:langflow@localhost:5432/langflow

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Checkout specific commit if provided
        if: ${{ github.event.inputs.commit_id != '' }}
        run: |
          git fetch --depth=1 origin ${{ github.event.inputs.commit_id }}
          git checkout ${{ github.event.inputs.commit_id }}
          echo "✅ Checked out commit ${{ github.event.inputs.commit_id }}"

      - name: Determine Commit ID
        id: commit
        run: |
          if [ -n "${{ github.event.inputs.commit_id }}" ]; then
            echo "commit_id=${{ github.event.inputs.commit_id }}" >> $GITHUB_OUTPUT
          else
            if [ "${{ github.event.inputs.branch }}" = "main" ]; then
              COMMIT_ID=$(git rev-parse HEAD)
            else
              COMMIT_ID=$(git log -1 --format="%H")
            fi
              echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT
          fi    

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          cd src/backend/base
          pip install uv
          pip install psycopg2-binary asyncpg
          pip install google-generativeai
          pip install .

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            if pg_isready -h "$LOCAL_GITHUB_POSTGRES_HOST" -p "$LOCAL_GITHUB_POSTGRES_PORT" -U "$LOCAL_GITHUB_POSTGRES_USER"; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Create database (safe)
        run: |
          psql "postgresql://$LOCAL_GITHUB_POSTGRES_USER:$LOCAL_GITHUB_POSTGRES_PASSWORD@$LOCAL_GITHUB_POSTGRES_HOST:$LOCAL_GITHUB_POSTGRES_PORT/postgres" \
          -tc "SELECT 1 FROM pg_database WHERE datname = '$LOCAL_GITHUB_POSTGRES_DB_NAME'" | grep -q 1 || \
          psql "postgresql://$LOCAL_GITHUB_POSTGRES_USER:$LOCAL_GITHUB_POSTGRES_PASSWORD@$LOCAL_GITHUB_POSTGRES_HOST:$LOCAL_GITHUB_POSTGRES_PORT/postgres" \
          -c "CREATE DATABASE \"$LOCAL_GITHUB_POSTGRES_DB_NAME\";"

      - name: Print Alembic current revision
        working-directory: src/backend/base/langflow
        env:
          LANGFLOW_DATABASE_URL: ${{ env.LOCAL_GITHUB_POSTGRES_DATABASE_URL }}
        run: |
          alembic -c alembic.ini current    

      - name: Apply migrations to PostgreSQL
        working-directory: src/backend/base/langflow
        env:
          LANGFLOW_DATABASE_URL: ${{ env.LOCAL_GITHUB_POSTGRES_DATABASE_URL }}
        run: |
          alembic -c alembic.ini upgrade head

      - name: Verify Alembic head revision applied
        working-directory: src/backend/base/langflow
        env:
          LANGFLOW_DATABASE_URL: ${{ env.LOCAL_GITHUB_POSTGRES_DATABASE_URL }}
        run: |
          set -euo pipefail

          HEAD_REVISION=$(alembic -c alembic.ini heads | grep -oE '[0-9a-f]{12,40}' | head -n 1)
          CURRENT_REVISION=$(alembic -c alembic.ini current | grep -oE '[0-9a-f]{12,40}' | head -n 1)

          echo "Head Revision:    $HEAD_REVISION"
          echo "Current Revision: $CURRENT_REVISION"

          if [ "$HEAD_REVISION" != "$CURRENT_REVISION" ]; then
            echo "❌ Alembic revision mismatch after upgrade"
            exit 1
          fi

          echo "✅ Alembic revision is at head"        

      - name: Get repo alembic version
        id: repo_version
        env:
          LOCAL_GITHUB_POSTGRES_DATABASE_URL: ${{ env.LOCAL_GITHUB_POSTGRES_DATABASE_URL }}
          ALEMBIC_OUTPUT_KEY: repo_alembic_version
          ALEMBIC_FALLBACK_TO_HEADS: "true"
          ALEMBIC_WORKDIR: src/backend/base/langflow
          ALEMBIC_INI: alembic.ini
        run: python .github/script/check_db_changes.py

      - name: Copy check_db_changes.py to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ github.event.inputs.environment == 'staging' && env.STAGING_HOST || env.PROD_HOST }}
          username: root
          password: ${{ github.event.inputs.environment == 'staging' && secrets.VM_PASSWORD || secrets.PROD_VM_PASSWORD }}
          source: ".github/script/check_db_changes.py"
          target: "/root/workspace/"

      - name: Get VM alembic version
        id: vm_version
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ github.event.inputs.environment == 'staging' && env.STAGING_HOST || env.PROD_HOST }}
          username: root
          password: ${{ github.event.inputs.environment == 'staging' && secrets.VM_PASSWORD || secrets.PROD_VM_PASSWORD }}
          capture_stdout: 'true'
          script: |
            REVISION=$(python3 /root/workspace/.github/script/check_db_changes.py | grep -oE '[0-9a-f]{12,40}')
            echo "vm_alembic_version=$REVISION"

      - name: Compare Alembic versions
        id: compare
        run: |
          VM_REVISION="d37bc4322900"
          REPO_REVISION="${{ steps.repo_version.outputs.repo_alembic_version }}"

          echo "Repo Revision: $REPO_REVISION"
          echo "VM Revision:   $VM_REVISION"

          if [ -z "$REPO_REVISION" ] || [ -z "$VM_REVISION" ]; then
            echo "❌ Missing Alembic revision(s)"
            exit 1
          fi

          if [ "$REPO_REVISION" != "$VM_REVISION" ]; then
            echo "db_changes=true" >> $GITHUB_OUTPUT
          else
            echo "db_changes=false" >> $GITHUB_OUTPUT
          fi      

          # ✅ Export for later SQL generation
          echo "VM_REVISION=$VM_REVISION" >> $GITHUB_ENV
          echo "REPO_REVISION=$REPO_REVISION" >> $GITHUB_ENV

      - name: Export VM revision output
        id: vm_output
        run: |
          VM_REVISION="d37bc4322900"
          echo "vm_alembic_version=$VM_REVISION" >> $GITHUB_OUTPUT          

  migration-flow:
    runs-on: ubuntu-latest
    needs: check-db-changes
    if: needs.check-db-changes.outputs.db_changes == 'true'
    env:
      VM_REVISION: ${{ needs.check-db-changes.outputs.vm_revision }}
      REPO_REVISION: ${{ needs.check-db-changes.outputs.repo_revision }}
      LOCAL_GITHUB_POSTGRES_DATABASE_URL: postgresql://langflow:langflow@localhost:5432/langflow
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-db-changes.outputs.commit_id }}

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd src/backend/base
          pip install uv
          pip install psycopg2-binary asyncpg
          pip install google-generativeai
          pip install .
      - name: Generate SQL Migration Files
        env:
          LANGFLOW_DATABASE_URL: ${{ env.LOCAL_GITHUB_POSTGRES_DATABASE_URL }}
        working-directory: src/backend/base/langflow  
        run: |
          set -euo pipefail
          mkdir -p alembic_sql

          if [ -z "${REPO_REVISION}" ] || [ -z "${VM_REVISION}" ]; then
            echo "❌ Missing Alembic revision(s)"
            exit 1
          fi

          echo "Generating downgrade SQL: ${REPO_REVISION} -> ${VM_REVISION}"
          alembic -c alembic.ini downgrade ${REPO_REVISION}:${VM_REVISION} --sql \
            > "alembic_sql/downgrade_${REPO_REVISION}_to_${VM_REVISION}.sql"

          echo "Generating upgrade SQL: ${VM_REVISION} -> ${REPO_REVISION}"
          alembic -c alembic.ini upgrade ${VM_REVISION}:${REPO_REVISION} --sql \
            > "alembic_sql/upgrade_${VM_REVISION}_to_${REPO_REVISION}.sql"
          
          cp "alembic_sql/downgrade_${REPO_REVISION}_to_${VM_REVISION}.sql" alembic_sql/downgrade.sql
          cp "alembic_sql/upgrade_${VM_REVISION}_to_${REPO_REVISION}.sql" alembic_sql/upgrade.sql  

      - name: Verify generated SQL files
        working-directory: src/backend/base/langflow
        run: |
          set -euo pipefail

          for file in alembic_sql/downgrade.sql alembic_sql/upgrade.sql; do
            if [ ! -s "$file" ]; then
              echo "❌ Missing or empty SQL file: $file"
              exit 1
            fi
          done

          echo "✅ Generated SQL files:"
          ls -l alembic_sql

          echo "--- Preview: downgrade.sql ---"
          head -n 20 alembic_sql/downgrade.sql || true

          echo "--- Preview: upgrade.sql ---"
          head -n 20 alembic_sql/upgrade.sql || true   

      - name: Upload SQL files
        uses: actions/upload-artifact@v4
        with:
          name: alembic-sql
          path: src/backend/base/langflow/alembic_sql/

      - name: Validate SQL with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/script/verify_sql_with_gemini.py src/backend/base/langflow/alembic_sql/upgrade.sql

      - name: Manual approval for DB changes
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1

      - name: Upload SQL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sql-migrations
          path: |
            src/backend/base/langflow/alembic_sql/upgrade.sql
            src/backend/base/langflow/alembic_sql/downgrade.sql
