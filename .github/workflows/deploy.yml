name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Clone external repo
      run: |
        git clone --branch main https://github.com/SaravanakumarR2018/DragDropAIAgentBuilder.git cloned_repo

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: forwardemailforaifirstdesk
        password: dckr_pat_eV3JetYHHyV7uNYxrccLqwhUgUs

    - name: Build Docker image
      run: |
        cd cloned_repo
        DOCKER_BUILDKIT=1 \
        VITE_AUTO_LOGIN=false \
        VITE_CLERK_AUTH_ENABLED=true \
        VITE_CLERK_PUBLISHABLE_KEY=pk_test_Y2hhcm1lZC1iYXQtNDEuY2xlcmsuYWNjb3VudHMuZGV2JA \
        make docker_build

    - name: Tag and Push Docker image
      run: |
        docker tag langflow:1.4.2 forwardemailforaifirstdesk/langflow:1.4.2
        docker push forwardemailforaifirstdesk/langflow:1.4.2

    - name: Upload deploy script to remote server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: 139.59.72.218
        username: root
        password: f@nTaBul0us
        source: "scripts/new_deploy.sh"
        target: "/root/"
        debug: true

    - name: Deploy to Remote VM via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 139.59.72.218
        username: root
        password: f@nTaBul0us
        script: |
          echo "Deploying on remote host..."
          ls -l /root/new_deploy.sh || echo "Script not found!"
          chmod +x /root/new_deploy.sh
          bash /root/new_deploy.sh
